services:
  - type: web
    name: onndaway-node-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000           # Render assigns its own port via $PORT, but set default
      - key: MONGO_URI
        sync: false            # Set this in Render dashboard (secret)
      - key: NEXTJS_URL
        sync: false            # e.g. https://onndaway.vercel.app
    healthCheckPath: /api/health
    autoDeploy: true
